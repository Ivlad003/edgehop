# Builds every platform and publishes a GitHub release when a version tag is
# pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The download buttons on the project page always point at the latest release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: go test -count=1 ./...
      - name: Build every platform
        run: sh build.sh
        env:
          VERSION: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}
      - name: Checksums
        run: cd dist && sha256sum edgehop-* > SHA256SUMS.txt
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/edgehop-* dist/SHA256SUMS.txt --title "edgehop $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
